<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="pantalla login">
    <header class="header-principal">
    <a href="./index.html"><img src="./img/Gemini_Generated_Image_3ru7yn3ru7yn3ru7.png" alt="Logo de la tienda"></a>

    <div>
         <ul>
        <li><a href="./index.html">Home</a></li>
        <li><a href="./login.html">Login</a></li>
        <li><a href="./register.html">Registro</a></li>
      </ul>
    </div>
     <main>
      <section class="seccion-login">
        <form class="formulario-login" action="index.html" method="post">
        <h2>Iniciar Sesión</h2>
        <div class="grupo-campo">
          <label for="email">Correo Electrónico</label>
          <input type="email" name="mail" placeholder="ejemplo@correo.com" required>
        </div>
        <div class="grupo-campo">
          <label for="password">Contraseña:</label>
          <input type="password" name="password" placeholder="Tu contraseña" required >
        </div>

        <button type="submit">Ingresar</button>
        <p class="enlace-registro">
          <a href="register.html">No tengo cuenta</a>
        </p>
      </form>
      </section>
     </main>
    
  </header>


     <footer>
    <p>Desarrollado por: Lourdes Espinoza, Lucia Caceres, Dana Sambuesa.</p>
  </footer>
</body>
</html>
