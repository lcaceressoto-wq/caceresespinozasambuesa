<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="pantalla login">
    <header class="header-principal">
        <a href="./index.html">
            <img src="./img/Gemini_Generated_Image_3ru7yn3ru7yn3ru7.png" alt="Logo de la tienda">
        </a>

        <form action="./search-results.html" method="GET">
            <input type="text" name="busqueda" class="input-buscar" placeholder="Buscar productos...">
            <button type="submit">Buscar</button>
        </form>

        <div>
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li class="menu-login"><a href="./login.html">Login</a></li>
                <li class="menu-registro"><a href="./register.html">Registro</a></li>
            </ul>
        </div>
        <p class="saludo"></p>
        <button type="button" class="cerrar-sesión">Cerrar sesión</button>
    </header>

    <main class="contenedor-principal">
        <aside class="menu-categorias">
            <nav>
                <ul></ul>
            </nav>
        </aside>

        <section class="seccion-login">
            <form class="form-auth" action="./index.html" method="post">
                <h2>Iniciar Sesión</h2>

                <div class="grupo-campo">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" name="mail" class="input-form email" placeholder="ejemplo@correo.com">
                </div>

                <div class="grupo-campo">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" class="input-form Pass" placeholder="Tu contraseña">
                </div>

                <button type="submit" class="btn-submit">Ingresar</button>

                <p class="enlace-registro">
                    <a href="./register.html">No tengo cuenta</a>
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>Desarrollado por: Lourdes Espinoza, Lucia Caceres, Dana Sambuesa.</p>
    </footer>
    <script src="./js/login.js"></script>
    <script src="./js/categorias.js"></script>
    <script src="./JS/saludo.js"></script>
    <script src="./JS/register.js"></script>
</body>
</html>
