                                                        <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>                                                                                   
    <link rel="stylesheet" href="css/style.css">
</head>
<body>    
    <header class="header-principal">
    <a href="./index.html"><img src="./img/Gemini_Generated_Image_3ru7yn3ru7yn3ru7.png" alt="Logo de la tienda"></a>

    <div>
        <ul>
        <li><a href="./index.html">Home</a></li>
        <li><a href="./login.html">Login</a></li>
        <li><a href="./register.html">Registro</a></li>
      </ul>
    </div>
  </header>
<main>
    <section class="seccion-registro">
        <form action="login.html" method="post">
            <h2>Registro</h2>
            <div>
                <label for="email">Correo Electrónico:</label>
                <input type="email" name="mail" placeholder="ejemplo@correo.com" value="" required>
            </div>
            <div> 
                <label for="password">Contrasñea:</label>
                <input type="password" name="Contraseña" placeholder="Crea tu contraseña" required>
            </div>
            <div>
                <label for="confirm-password">Repetir Contraseña:</label>
                <input type="password" name="Contraseña" placeholder="Repite tu contraseña" value="" required>
            </div>
            <div class="opciones-terminos">
                <input type="checkbox" name="Términos" required >
                <label for="terminos">Acepto términos y condiciones</label>
            </div>
             <button type="submit">Registrarme</button>
            <p>
                <a href="login.html">Ya tengo cuenta.</a>
            </p>
        </form>
    </section>
</main>



   <footer>
    <p>Desarrollado por: Lourdes Espinoza, Lucia Caceres, Dana Sambuesa.</p>
  </footer>
</body>
</html>
