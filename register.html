<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>                                                                                   
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>    
    <header class="header-principal">
    <a href="./index.html"><img src="./img/Gemini_Generated_Image_3ru7yn3ru7yn3ru7.png" alt="Logo de la tienda"></a>
<form action="./search-results.html" method="GET" class="form-buscador">
<input type="text" name="busqueda" class="input-buscar" placeholder="Buscar productos...">
<button type="submit">Buscar</button>
<p class="mensaje-error"></p>
</form>
    <div>
        <ul>
        <li><a href="./index.html">Home</a></li>
        <li class="menu-login"><a href="./login.html">Login</a></li>
        <li class="menu-registro"><a href="./register.html">Registro</a></li>
      </ul>
    </div>
    <p class="saludo"></p>
    <button type="button" class="cerrar-sesión">Cerrar sesión</button>
  </header>
  <main class="contenedor-principal"> 
    <aside class="menu-categorias">
      <nav>
      <ul></ul>
      </nav>
    </aside>
    <section class="seccion-registro">
        <form class="form-auth" action="./login.html" method="post">
            <h2>Registro</h2>
            <div>
                <label for="email">Correo Electrónico:</label>
                <input type="email" name="mail" class="input-form" placeholder="ejemplo@correo.com" value="" required>
            </div>
            <div> 
                <label for="password">Contraseña:</label>
                <input type="password" name="Contraseña" class=".input-form" placeholder="Crea tu contraseña" required>
            </div>
            <div>
                <label for="confirm-password">Repetir Contraseña:</label>
                <input type="password" name="Contraseña" class=".input-form" placeholder="Repite tu contraseña" value="" required>
            </div>
            <div class="opciones-terminos">
                <input type="checkbox" name="Términos" required > Acepto términos y condiciones
            </div>
             <button type="submit" class="btn-submit">Registrarme</button>
            <p class="enlace-registro">
                <a href="./login.html">Ya tengo cuenta.</a>
            </p>
        </form>
    </section></main>



   <footer>
    <p>Desarrollado por: Lourdes Espinoza, Lucia Caceres, Dana Sambuesa.</p>
  </footer>

  <script src="./JS/categorias.js"></script>
  <script src="./JS/register.js"></script>
  <script src="./js/validacion-buscador.js"></script>
</body>
</html>
